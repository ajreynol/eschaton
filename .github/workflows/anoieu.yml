name: anoieu

on: [push, pull_request]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the pinned Anoieu checker
        env:
          # Adopt only commits where Anoieu's own CI passed.
          ANOIEU_REV: 442bb679d1b0cbc583c9c9cd3901b132b82f1ea3
        run: |
          git clone --quiet https://github.com/ajreynol/anoieu "$RUNNER_TEMP/anoieu"
          git -C "$RUNNER_TEMP/anoieu" checkout --quiet --detach "$ANOIEU_REV"
      - name: Check repository policy
        run: python3 "$RUNNER_TEMP/anoieu/scripts/policy_check.py" --root "$GITHUB_WORKSPACE"
